{% extends "base.html" %}

{% block title %}{% if contact %}Edit Contact{% else %}Add Contact{% endif %}{% endblock %}

{% block content %}
    <h1>{% if contact %}Edit Contact{% else %}Add Contact{% endif %}</h1>
    <form method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ contact.name if contact else '' }}">
        <br>
        <label for="phone">Phone:</label>
        <input type="text" id="phone" name="phone" value="{{ contact.phone if contact else '' }}">
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{ contact.email if contact else '' }}">
        <br>
        <input type="submit" value="{% if contact %}Save{% else %}Add{% endif %}">
    </form>
{% endblock %}
