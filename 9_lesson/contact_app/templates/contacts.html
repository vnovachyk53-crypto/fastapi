{% extends "base.html" %}

{% block title %}Contacts{% endblock %}

{% block content %}
    <h1>Contacts</h1>
    <ul>
        {% for contact in contacts %}
            <li>
                <strong>{{ contact.name }}</strong> - {{ contact.phone }}
                {% if contact.email %} - {{ contact.email }}{% endif %}
                <a href="/edit_contact/{{ contact.id }}">Edit</a>
                <a href="/delete_contact/{{ contact.id }}">Delete</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
